# リリースを公開したときに、Skill ごとの .skill（<name>.skill）を作ってリリースに添付する。
# .skill は claude.ai に入れる形式（中身は ZIP）で、scripts/package-skills.mjs が作る。
# 手元の gh skill publish などで作ったリリースのためのもの。release.yml で作ったリリースには、release.yml が添付する。
#
# 作るためのスクリプトは既定のブランチの最新のものを使い、中身はタグの版から取る。古いタグのリリースにも、
# 今の形式のファイル（.skill など）を後から添付できる。中身が同じなら、作り直したファイルのバイト列も同じになる。
#
# 不変リリース（immutable releases）を有効にすると、公開したリリースには添付できない。
# その場合は、タグを push して下書きのリリースを作り、このワークフローを workflow_dispatch で実行してから公開する。
name: release-assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: .skillを添付するリリースのタグ（例：v0.1.0）
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build a .skill per skill
        run: node scripts/package-skills.mjs --ref "refs/tags/$TAG" --out dist
      - name: Attach the .skill files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.skill --clobber --repo "$GITHUB_REPOSITORY"
