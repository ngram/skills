name: skills

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # spell-check の check_spelling.mjs のテストに使う。バージョンは、Skill の手元の確認とそろえる。
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install typos
        run: python -m pip install typos==1.51.1
      - name: Check generated files and skill frontmatter
        run: node scripts/sync-skills.mjs --check
      - name: Test helper scripts
        env:
          REQUIRE_TYPOS: "1"
        run: node --test tests/*.test.mjs
      - name: Validate the Claude Code marketplace
        run: npx --yes @anthropic-ai/claude-code@2.1.293 plugin validate .
      - name: Validate skills with gh skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          gh skill publish --dry-run

  # Skill の補助スクリプトは手元の Windows でも使うので、パスの区切りなどの違いを Windows でも確かめる。
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install typos
        run: python -m pip install typos==1.51.1
      - name: Check generated files and skill frontmatter
        run: node scripts/sync-skills.mjs --check
      - name: Test helper scripts
        env:
          REQUIRE_TYPOS: "1"
        run: node --test tests/*.test.mjs
