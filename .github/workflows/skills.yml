name: skills

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check generated files and skill frontmatter
        run: node scripts/sync-skills.mjs --check
      - name: Test helper scripts
        run: node --test tests/*.test.mjs
      - name: Validate the Claude Code marketplace
        run: npx --yes @anthropic-ai/claude-code@2.1.293 plugin validate .
      - name: Validate skills with gh skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          gh skill publish --dry-run
